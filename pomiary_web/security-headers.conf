# The page's security headers (A4), on every response of the web container. nginx drops the
# add_header lines of the server block in a location that has its own add_header, so every such
# location includes this file again.
#
# style-src has 'unsafe-inline' because Mantine sets inline style attributes; scripts stay
# 'self' only.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
