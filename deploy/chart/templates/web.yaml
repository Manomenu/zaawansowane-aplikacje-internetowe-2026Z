apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "app.image" (dict "Values" .Values "component" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            # A service name, not an address — exactly what ${API_UPSTREAM} exists for
            # in nginx.conf.template. In compose http://server:6220 is enough; here the full name,
            # because nginx resolves it by itself every few seconds and does not know the search
            # domains from /etc/resolv.conf, so the short service name would not work.
            - name: API_UPSTREAM
              value: http://{{ include "app.name" . }}-server.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.server.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.web.port }}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.web.port }}
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}-web
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
  ports:
    - port: 80
      targetPort: {{ .Values.web.port }}
