apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.name" . }}-server
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "app.image" (dict "Values" .Values "component" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
          env:
            # Port from values, not from .env.base — one source of truth for the probe and the process.
            - name: PORT
              value: {{ .Values.server.port | quote }}
          {{- with .Values.server.databaseSecret }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          # /health touches nothing outside the process, so it is suitable as a probe.
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.name" . }}-server
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  # ClusterIP: visible only inside the cluster. From outside you enter through web anyway,
  # which proxies /api — the same as in compose.
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
