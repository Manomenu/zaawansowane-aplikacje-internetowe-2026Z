{{- /*
Post-deployment check. Argo runs this Job after every sync (PostSync hook), once the rest
of the release is healthy. A few requests through the Services in the cluster — the way
traffic arrives from the tunnel — and that is all. When one fails, the Argo sync is
failed (red in `just argo apps`), and the Job log says what broke.

Full browser tests run in CI, before the image is even built.
*/ -}}
{{- if .Values.smokeTest.enabled }}
{{- /* The web Service exposes port 80 (templates/web.yaml), so the address has no port. */ -}}
{{- $web := printf "http://%s-web" (include "app.name" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.name" . }}-smoke-test
  labels:
    {{- include "app.labels" . | nindent 4 }}
    app.kubernetes.io/component: smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    # The previous Job (and its log) stays until the next deployment, then disappears.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # No retries: transient problems are caught by the loop in the script, and a Job retry would only hide them.
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        {{- include "app.labels" . | nindent 8 }}
        app.kubernetes.io/component: smoke-test
    spec:
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: {{ .Values.smokeTest.image }}
          env:
            - name: WEB
              value: {{ $web | quote }}
          command:
            - sh
            - -c
            - |
              set -u
              failed=0
              # expect STATUS PATH [TEXT] — response code (and a body fragment) through web, as from the tunnel.
              expect() {
                status="$1"; path="$2"; text="${3:-}"
                for attempt in 1 2 3 4 5 6; do
                  got="$(curl -s -o /tmp/body -w '%{http_code}' "$WEB$path")"
                  if [ "$got" = "$status" ] && { [ -z "$text" ] || grep -q "$text" /tmp/body; }; then
                    echo "ok    $status $path"
                    return 0
                  fi
                  sleep 5
                done
                echo "FAIL  $path: expected $status${text:+ with \"$text\"}, got $got"
                head -c 300 /tmp/body; echo
                failed=1
              }
              expect 200 /healthz                          # the page (nginx) is alive
              expect 200 /api/health '"ok"'                # the server answers (and has a database — it does not start without one)
              exit "$failed"
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
          securityContext:
            # The image names the user (curl_user), and runAsNonRoot can only check a
            # number — so the number, taken from the image.
            runAsUser: 100
            runAsNonRoot: true
            allowPrivilegeEscalation: false
{{- end }}
